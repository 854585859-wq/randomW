<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Concert Info</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=24">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="topbar-logo">Concert Info</a>
      <div class="topbar-subtitle">Korea Concert Calendar</div>
      <nav class="topbar-links desktop-nav">
        <a href="#" data-tab="calendar" class="active">日历</a>
        <a href="#" data-tab="venues">场馆</a>
        <a href="#" data-tab="more">更多</a>
      </nav>
    </div>
  </header>

  <div class="container">

    <!-- 日历：左月历 + 右 upcoming -->
    <div id="viewCalendar">
      <div class="cal-toggle">
        <button type="button" class="ct-btn active" data-calmode="calendar">日历</button>
        <button type="button" class="ct-btn" data-calmode="list">最近演出</button>
      </div>
      <div class="calendar-layout">
        <div class="cal-left">
          <div class="calendar-header">
            <div class="cal-title">
              <span id="calTitleSub"></span>
              <h2 id="calTitle"></h2>
            </div>
            <div class="cal-nav">
              <span class="stamp">票</span>
              <button class="btn btn-sm" id="btnPrev">‹</button>
              <button class="btn btn-sm" id="btnNext">›</button>
            </div>
          </div>
          <div class="calendar-grid" id="calGrid"></div>
        </div>
        <div class="cal-right">
          <span class="section-label">近期演出</span>
          <div id="listContent"></div>
        </div>
      </div>
    </div>

    <!-- 场馆视图：直接进日历，返回看场馆列表 -->
    <div id="viewVenues" class="hidden">
      <div id="venueList">
        <h2 class="section-title">场馆档期</h2>
        <div class="form-group">
          <input type="text" id="venueSearch" class="form-input" placeholder="搜索场馆…">
        </div>
        <div id="venueButtons" class="venue-grid"></div>
      </div>
      <div id="venueCalendar" class="hidden">
        <button type="button" class="btn btn-sm" id="btnBackVenue">‹ 返回</button>
        <div id="scheduleArea" style="margin-top:1.1rem;"></div>
      </div>
    </div>

    <!-- 更多视图 -->
    <div id="viewMore" class="hidden">
      <span class="section-label">更多</span>

      <div class="action-row" onclick="showSubscribe()">
        <div class="aico">🔔</div>
        <div class="atext"><div class="alabel">订阅艺人</div><div class="ahint">关注喜欢的艺人，有新演出邮件通知</div></div>
        <span class="chev">›</span>
      </div>

      <div class="action-row" onclick="showFeedback()">
        <div class="aico">✉️</div>
        <div class="atext"><div class="alabel">提供信息</div><div class="ahint">有没有收录的演出？告诉我们补上</div></div>
        <span class="chev">›</span>
      </div>

      <div class="action-row" onclick="showShare()">
        <div class="aico">📤</div>
        <div class="atext"><div class="alabel">分享</div><div class="ahint">把日历分享给一起看演出的朋友</div></div>
        <span class="chev">›</span>
      </div>

      <div class="page-footer">
        <p class="footer-social">
          Made by <a href="https://www.xiaohongshu.com/user/profile/62263f78000000000201d714" target="_blank" rel="noopener">@今天也想看演唱会</a>
        </p>
        <p class="footer-note">场馆图片来源 Wikimedia Commons（CC0 / CC BY / CC BY-SA / KOGL 等免费授权）</p>
      </div>
    </div>
  </div>

  <!-- 底部 Tab（手机端） -->
  <nav class="tabbar" id="tabbar">
    <div class="tab active" data-tab="calendar">日历</div>
    <div class="tab" data-tab="venues">场馆</div>
    <div class="tab" data-tab="more">更多</div>
  </nav>

  <script src="/js/utils.js"></script>
  <script>
    const DAYS = ['日', '一', '二', '三', '四', '五', '六'];
    const HEADER_EN = ['M', 'T', 'W', 'T', 'F', 'SAT', 'SUN'];
    const HEADER_KO = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
    const dayHeaders = () => HEADER_EN.map((en, i) =>
      `<div class="calendar-day-header${i >= 4 ? ' weekend' : ''}"><span class="dh-en">${en}</span><span class="dh-ko">${HEADER_KO[i]}</span></div>`
    ).join('');
    let allConcerts = [], allVenues = [];
    let currentYear, currentMonth;
    let venueYear, venueMonth;
    let activeVenueId = null;
    let currentTab = 'calendar';
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    venueYear = now.getFullYear();
    venueMonth = now.getMonth();

    async function loadData() {
      try { allConcerts = await api('/api/concerts'); } catch(e) { allConcerts = []; }
      try { allVenues = await api('/api/venues'); } catch(e) { allVenues = []; }
    }

    // ── 工具 ──
    function concertOnDate(c, dateKey) {
      if (c.date === dateKey) return true;
      if (c.end_date && c.date <= dateKey && dateKey <= c.end_date) return true;
      return false;
    }
    function parseDate(str) { // YYYY-MM-DD -> Date
      const p = str.split('-');
      return new Date(p[0], p[1]-1, p[2]);
    }
    function mdStr(str) { // YYYY-MM-DD -> MM.DD
      const p = str.split('-');
      return p[1] + '.' + p[2];
    }
    function wdStr(str) { // YYYY-MM-DD -> 周X
      return '周' + DAYS[parseDate(str).getDay()];
    }
    function todayKey() {
      return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    }

    // ── upcoming 列表 ──
    function renderList() {
      const el = document.getElementById('listContent');
      const t = todayKey();
      const upcoming = allConcerts
        .filter(c => (c.end_date || c.date) >= t)
        .sort((a, b) => a.date.localeCompare(b.date));
      if (upcoming.length === 0) {
        el.innerHTML = '<div class="empty"><p>暂无近期演出</p></div>';
        return;
      }
      el.innerHTML = upcoming.map(c => {
        return `<div class="event-card" onclick="showDetail(${c.id})">
          <div class="date"><div class="md">${mdStr(c.date)}</div><div class="wd">${wdStr(c.date)}</div></div>
          <div class="info">
            <div class="artist">${escHtml(c.artist)}</div>
            <div class="venue">${c.end_date && c.end_date !== c.date ? escHtml(mdStr(c.end_date)) + ' · ' : ''}🏟️ ${escHtml(c.venue_name)}</div>
          </div>
          <span class="tick">›</span>
        </div>`;
      }).join('');
    }

    // ── 月历视图 ──
    function renderCalendar() {
      const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      const MONTH_FULL = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
      document.getElementById('calTitle').textContent = MONTH_ABBR[currentMonth];
      document.getElementById('calTitleSub').textContent = MONTH_FULL[currentMonth] + ' ' + currentYear;
      const grid = document.getElementById('calGrid');
      let html = dayHeaders();
      const firstDay = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

      for (let i = firstDay - 1; i >= 0; i--) {
        const d = daysInPrevMonth - i;
        const mm = currentMonth === 0 ? 12 : currentMonth;
        const yy = currentMonth === 0 ? currentYear - 1 : currentYear;
        const key = `${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        html += `<div class="calendar-cell other-month"><div class="day-num">${d}</div>${renderEvents(key)}</div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const tk = todayKey();
        html += `<div class="calendar-cell${key === tk ? ' today' : ''}"><div class="day-num">${d}</div>${renderEvents(key)}</div>`;
      }
      const total = firstDay + daysInMonth;
      const rem = total % 7 === 0 ? 0 : 7 - (total % 7);
      for (let d = 1; d <= rem; d++) {
        const nm = currentMonth + 2 > 12 ? 1 : currentMonth + 2;
        const ny = nm === 1 ? currentYear + 1 : currentYear;
        const key = `${ny}-${String(nm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        html += `<div class="calendar-cell other-month"><div class="day-num">${d}</div>${renderEvents(key)}</div>`;
      }
      grid.innerHTML = html;
    }
    function renderEvents(dateKey) {
      return allConcerts.filter(c => concertOnDate(c, dateKey)).map(c => {
        return `<div class="calendar-event" onclick="event.stopPropagation();showDetail(${c.id})">${escHtml(c.artist)}</div>`;
      }).join('');
    }

    // ── 详情弹窗（票根风） ──
    function showDetail(id) {
      const c = allConcerts.find(x => x.id === id);
      if (!c) return;
      const body = showModal(c.artist, '');
      const dateRange = c.end_date && c.end_date !== c.date ? `${c.date} → ${c.end_date}` : c.date;
      body.innerHTML = `
        <div class="ticket">
          <div class="t-stamp">${escHtml(mdStr(c.date))}</div>
          <div class="t-row"><span class="t-k">日期</span><span class="t-v">${escHtml(dateRange)}</span></div>
          <div class="t-row"><span class="t-k">场馆</span><span class="t-v">${escHtml(c.venue_name)}</span></div>
          ${c.description ? `<div class="t-desc">${escHtml(c.description)}</div>` : ''}
        </div>
        <div class="ticket-divider"></div>
        <div style="padding:0 1.4rem;"><div class="barcode"></div></div>
        <div class="ticket-foot"><span>Concert Info</span><span>★ ${escHtml(mdStr(c.date))}</span></div>
      `;
    }

    // ── 场馆视图 ──
    // 15 个场馆的真实信息：区域 / 座位数 / 图片（本地存储）
    const VENUE_META = {
      5:  { region: 'SEOUL REGION', capacity: '15,000', img: '/img/venues/kspo.jpg', seat: '/img/seats/kspo.jpg' },            // KSPO DOME
      2:  { region: 'INCHEON REGION', capacity: '15,000', img: '/img/venues/inspire.jpg', seat: '/img/seats/inspire.webp', seat2: '/img/seats/inspire-3d.jpg' },        // INSPIRE Arena
      3:  { region: 'SEOUL REGION', capacity: '17,000–25,000', img: '/img/venues/gocheok.jpg' },   // 高尺天空巨蛋
      4:  { region: 'SEOUL REGION', capacity: '11,069', img: '/img/venues/jamsil.jpg' },           // 蚕室室内体育馆
      6:  { region: 'SEOUL REGION', capacity: '2,432–3,584', img: '/img/venues/olympic-hall.jpg', seat: '/img/seats/olympic-hall.jpg' }, // 奥林匹克大厅
      17: { region: 'SEOUL REGION', capacity: '5,003', img: '/img/venues/ticketlink-live.jpg', seat: '/img/seats/ticketlink.jpg' },   // TICKET LINK LIVE ARENA
      11: { region: 'SEOUL REGION', capacity: '5,000（坐席）–6,500（站席）', img: '/img/venues/hwajeong.jpg', seat: '/img/seats/hwajeong.jpg' },          // 高丽大化汀
      7:  { region: 'SEOUL REGION', capacity: '4,507（含 1,324 座位）', img: '/img/venues/jangchung.jpg' },         // 奖忠体育馆
      1:  { region: 'SEOUL REGION', capacity: '1,010', img: '/img/venues/ticketlink1975.jpg' },    // Ticketlink 1975 剧场
      9:  { region: 'GYEONGGI REGION', capacity: '6,000–10,000', img: '/img/venues/kintex.jpg' },  // KINTEX HALL
      14: { region: 'SEOUL REGION', capacity: '2,222', img: '/img/venues/kbs.jpg', pos: '50% 100%' }, // KBS Arena
      16: { region: 'SEOUL REGION', capacity: '2,000', img: '/img/venues/myunghwa.jpg' },          // 明华 Myunghwa
      12: { region: 'GYEONGGI REGION', capacity: '41,311', img: '/img/venues/goyang.jpg' },        // 高阳体育场
      15: { region: 'SEOUL REGION', capacity: '2,500', img: '/img/venues/yes24.jpg', seat: '/img/seats/yes24-reserved.png', seat2: '/img/seats/yes24-standing.png' },  // YES24 LIVE HALL
      13: { region: 'INCHEON REGION', capacity: '29,376', img: '/img/venues/incheon.jpg' }         // 仁川亚运主体育场
    };
    function venueRegion(name) {
      name = name || '';
      if (name.indexOf('NAVER') >= 0 || name.indexOf('仁川') >= 0) return 'INCHEON REGION';
      if (name.indexOf('高阳') >= 0 || name.indexOf('KINTEX') >= 0 || name.indexOf('一山') >= 0) return 'GYEONGGI REGION';
      return 'SEOUL REGION';
    }
    function renderVenueButtons() {
      const container = document.getElementById('venueButtons');
      const kw = (document.getElementById('venueSearch').value || '').trim().toLowerCase();
      const list = kw ? allVenues.filter(v => v.name.toLowerCase().indexOf(kw) >= 0) : allVenues;
      if (list.length === 0) {
        container.innerHTML = '<p style="color:var(--ink-25);font-size:0.8rem;">未找到场馆</p>';
        return;
      }
      container.innerHTML = list.map(v => {
        const m = VENUE_META[v.id] || { region: venueRegion(v.name) };
        const active = activeVenueId === v.id;
        const meta = m.capacity
          ? `<div class="v-meta">
              <div class="row"><span class="k">Capacity</span><span class="val">${m.capacity}</span></div>
            </div>` : '';
        return `<div class="venue-card${active ? ' active' : ''}" onclick="selectVenue(${v.id})">
          <div class="v-photo">${m.img ? `<img src="${m.img}" alt="${escHtml(v.name)}" loading="lazy"${m.pos ? ` style="object-position:${m.pos}"` : ''}>` : ''}</div>
          <div class="v-body">
            <div class="v-name">${escHtml(v.name)}</div>
            <div class="v-region">${escHtml(m.region)}</div>
            ${meta}
          </div>
        </div>`;
      }).join('');
    }
    function showVenueList() {
      document.getElementById('venueCalendar').classList.add('hidden');
      document.getElementById('venueList').classList.remove('hidden');
      renderVenueButtons();
    }
    function showVenueCalendar() {
      if (!activeVenueId) activeVenueId = allVenues.length ? allVenues[0].id : null;
      venueYear = now.getFullYear();
      venueMonth = now.getMonth();
      document.getElementById('venueList').classList.add('hidden');
      document.getElementById('venueCalendar').classList.remove('hidden');
      renderVenueCalendar();
    }
    function selectVenue(venueId) {
      activeVenueId = venueId;
      showVenueCalendar();
    }
    function renderVenueCalendar() {
      const area = document.getElementById('scheduleArea');
      const venue = allVenues.find(v => v.id === activeVenueId);
      if (!venue) {
        area.innerHTML = '<div class="empty"><div class="empty-icon">📍</div><p>选择场馆查看档期</p></div>';
        return;
      }
      const vcArr = allConcerts.filter(c => c.venue_id === venue.id);
      let html = `<div class="calendar-header">
        <h2>${escHtml(venue.name)} · ${venueYear}.${String(venueMonth+1).padStart(2,'0')}</h2>
        <div><button class="btn btn-sm" onclick="venueMonthShift(-1)">‹</button><button class="btn btn-sm" onclick="venueMonthShift(1)">›</button></div>
      </div>`;
      html += '<div class="calendar-grid">';
      html += dayHeaders();
      const firstDay = (new Date(venueYear, venueMonth, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(venueYear, venueMonth + 1, 0).getDate();
      const daysInPrevMonth = new Date(venueYear, venueMonth, 0).getDate();
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = daysInPrevMonth - i;
        const mm = venueMonth === 0 ? 12 : venueMonth;
        const yy = venueMonth === 0 ? venueYear - 1 : venueYear;
        const key = `${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        html += `<div class="calendar-cell other-month"><div class="day-num">${d}</div>${venueEvents(key, vcArr)}</div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${venueYear}-${String(venueMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const tk = todayKey();
        html += `<div class="calendar-cell${key === tk ? ' today' : ''}"><div class="day-num">${d}</div>${venueEvents(key, vcArr)}</div>`;
      }
      const total = firstDay + daysInMonth;
      const rem = total % 7 === 0 ? 0 : 7 - (total % 7);
      for (let d = 1; d <= rem; d++) {
        const nm = venueMonth + 2 > 12 ? 1 : venueMonth + 2;
        const ny = nm === 1 ? venueYear + 1 : venueYear;
        const key = `${ny}-${String(nm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        html += `<div class="calendar-cell other-month"><div class="day-num">${d}</div>${venueEvents(key, vcArr)}</div>`;
      }
      html += '</div>';
      const vm = VENUE_META[venue.id] || {};
      const seatImgs = [vm.seat, vm.seat2].filter(Boolean);
      if (seatImgs.length) {
        html += `<div class="seat-section">
          <h3 class="seat-title">座位参考图</h3>
          ${seatImgs.map((s, i) => `<div class="seat-figure"><img src="${s}" alt="${escHtml(venue.name)} 座位图 ${i + 1}" loading="lazy"></div>`).join('')}
          <p class="seat-note">仅供参考，实际请以官方票务页面为准</p>
        </div>`;
      }
      area.innerHTML = html;
    }
    function venueEvents(dateKey, concerts) {
      return concerts.filter(c => concertOnDate(c, dateKey)).map(c => {
        return `<div class="calendar-event" onclick="event.stopPropagation();showDetail(${c.id})">${escHtml(c.artist)}</div>`;
      }).join('');
    }
    function venueMonthShift(delta) {
      venueMonth += delta;
      if (venueMonth < 0) { venueMonth = 11; venueYear--; }
      if (venueMonth > 11) { venueMonth = 0; venueYear++; }
      renderVenueCalendar();
    }

    // ── 操作 ──
    window.showSubscribe = function() {
      const body = showModal('订阅艺人', '', () => {});
      body.innerHTML = `
        <div style="padding:0 1.4rem 1.4rem;">
          <p style="font-size:0.8rem;color:var(--ink-50);margin-bottom:0.9rem;">填写你想关注的艺人，有新演出时邮件通知</p>
          <form id="subForm" onsubmit="submitSubscribe(event)">
            <div class="form-group"><label>邮箱 *</label><input type="email" name="email" class="form-input" required></div>
            <div class="form-group"><label>艺人 *</label><input type="text" name="artist" class="form-input" required placeholder="输入想关注的艺人名"></div>
            <button type="submit" class="btn btn-primary" style="width:100%">订阅</button>
          </form>
        </div>
      `;
    };
    window.submitSubscribe = async function(e) {
      e.preventDefault();
      const f = e.target;
      try {
        const res = await api('/api/subscribe', { method: 'POST', body: JSON.stringify({ email: f.email.value, artist: f.artist.value }) });
        f.closest('.modal-overlay').remove();
        alert(res.message || '订阅成功！');
      } catch(err) { alert('订阅失败: ' + err.message); }
    };

    window.showFeedback = function() {
      const body = showModal('提供信息', '', () => {});
      body.innerHTML = `
        <div style="padding:0 1.4rem 1.4rem;">
          <form id="fbForm" onsubmit="submitFeedback(event)">
            <div class="form-group">
              <textarea name="message" class="form-input" rows="4" required placeholder="艺人/场馆/时间，如果有没有添加的演出，请告知…"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">提交</button>
          </form>
        </div>
      `;
    };
    window.submitFeedback = async function(e) {
      e.preventDefault();
      const f = e.target;
      try {
        await api('/api/user-feedback', { method: 'POST', body: JSON.stringify({ name: '', email: '', message: f.message.value, page: 'calendar' }) });
        f.closest('.modal-overlay').remove();
        alert('提交成功！');
      } catch(err) { alert('提交失败: ' + err.message); }
    };

    window.showShare = function() {
      const body = showModal('分享', '', () => {});
      body.innerHTML = `
        <div style="padding:0 1.4rem 1.4rem;text-align:center;line-height:2;">
          <p style="font-size:0.85rem;">韩国演唱会日历 · 查档期超方便 👀</p>
          <p style="margin-top:0.8rem;padding:0.6rem;background:var(--paper);border-radius:6px;font-size:0.9rem;user-select:all;">concert-kr.space</p>
          <p style="font-size:0.65rem;color:var(--ink-25);margin-top:0.4rem;">长按选中网址即可复制</p>
        </div>
      `;
    };

    // ── 导航 ──
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('viewCalendar').classList.toggle('hidden', tab !== 'calendar');
      document.getElementById('viewVenues').classList.toggle('hidden', tab !== 'venues');
      document.getElementById('viewMore').classList.toggle('hidden', tab !== 'more');

      document.querySelectorAll('.topbar-links a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
      document.querySelectorAll('.tabbar .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));

      if (tab === 'calendar') { renderCalendar(); renderList(); }
      if (tab === 'venues') { showVenueList(); }
    }
    function calMode(mode) {
      document.getElementById('viewCalendar').classList.toggle('mode-list', mode === 'list');
      document.querySelectorAll('.cal-toggle .ct-btn').forEach(b => b.classList.toggle('active', b.dataset.calmode === mode));
    }

    // 事件绑定
    document.getElementById('btnPrev').addEventListener('click', () => { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); });
    document.getElementById('btnNext').addEventListener('click', () => { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); });
    document.getElementById('venueSearch').addEventListener('input', renderVenueButtons);
    document.getElementById('btnBackVenue').addEventListener('click', showVenueList);
    document.querySelectorAll('.topbar-links a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); switchTab(a.dataset.tab); }));
    document.querySelectorAll('.tabbar .tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
    document.querySelectorAll('.cal-toggle .ct-btn').forEach(b => b.addEventListener('click', () => calMode(b.dataset.calmode)));

    // 初始化
    (async () => {
      await loadData();
      const hash = location.hash.replace('#', '');
      const tab = (hash === 'venues' || hash === 'more') ? hash : 'calendar';
      switchTab(tab);
      if (!localStorage.getItem('notrack')) fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: tab === 'venues' ? 'venues' : 'calendar' }) }).catch(() => {});
    })();
  </script>
</body>
</html>
